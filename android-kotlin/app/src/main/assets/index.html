<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="tabs">
        <button class="tab active" id="tab-calc" data-view="calc">Calculator</button>
        <button class="tab" id="tab-convert" data-view="convert">Converter</button>
      </header>

      <section class="view active" id="view-calc">
      <div class="display">
        <div class="display-top">
          <button class="icon-btn" id="lang-btn" aria-label="Language">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="M3.2 12h17.6M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"
                    fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <button class="icon-btn" id="history-btn" aria-label="History">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="M12 7.5v5l3.6 2.1" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="icon-badge" id="history-count" hidden>0</span>
          </button>
        </div>
        <div class="display-bottom">
          <div class="expression" id="expression" aria-live="polite">0</div>
          <div class="preview" id="preview"></div>
        </div>
      </div>

      <div class="keys" id="keys">
        <button class="key fn clear" data-key="AC">AC</button>
        <button class="key fn group" data-key="()">( )</button>
        <button class="key fn group" data-key="%">%</button>
        <button class="key op" data-key="/">÷</button>

        <button class="key fn func" data-key="sqrt(">√</button>
        <button class="key fn func" data-key="^" aria-label="Power"><span class="key-label">x<sup>y</sup></span></button>
        <button class="key fn func" data-key="BACK" aria-label="Backspace">⌫</button>
        <button class="key op" data-key="*">×</button>

        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key op" data-key="-">−</button>

        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key op" data-key="+">+</button>

        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key equals" data-key="=" aria-label="Equals">=</button>

        <button class="key" data-key="±">±</button>
        <button class="key" data-key="0">0</button>
        <button class="key" data-key=".">.</button>
      </div>
      </section>

      <section class="view" id="view-convert">
        <div class="conv-display">
          <span class="conv-label" id="conv-label"></span>
          <input class="conv-input" id="conv-input" type="text" inputmode="decimal"
                 autocomplete="off" spellcheck="false" placeholder="0" />
          <div class="conv-result" id="conv-result">0</div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="conv-list" id="conv-list"></div>
      </section>
    </main>

    <div class="sheet-backdrop" id="history-backdrop" hidden></div>
    <aside class="sheet" id="history-sheet" hidden aria-label="Calculation history">
      <header class="sheet-header">
        <h2 class="sheet-title" id="history-title">History</h2>
        <div class="sheet-actions">
          <button class="sheet-btn danger" id="history-clear">Clear</button>
          <button class="sheet-btn" id="history-close">Close</button>
        </div>
      </header>
      <div class="sheet-body" id="history-list"></div>
      <p class="sheet-empty" id="history-empty">No calculations yet.</p>
    </aside>

    <div class="text-menu" id="text-menu" hidden role="menu">
      <button class="text-menu-btn" id="text-menu-copy" role="menuitem">Copy</button>
      <span class="text-menu-divider" aria-hidden="true"></span>
      <button class="text-menu-btn" id="text-menu-paste" role="menuitem">Paste</button>
    </div>

    <div class="sheet-backdrop" id="lang-backdrop" hidden></div>
    <aside class="sheet" id="lang-sheet" hidden aria-label="Language">
      <header class="sheet-header">
        <h2 class="sheet-title" id="lang-title">Language</h2>
        <button class="sheet-btn" id="lang-close">Close</button>
      </header>
      <div class="sheet-body" id="lang-list"></div>
    </aside>

    <script src="i18n.js" defer></script>
    <script src="main.js" defer></script>
  </body>
</html>
