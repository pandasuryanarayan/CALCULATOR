name: Build Kotlin APK

# Builds, tests and signs the Kotlin + WebView version of the calculator
# (the android-kotlin branch's app). No local Android toolchain required.

on:
  push:
    branches: [main, android-kotlin]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"
  workflow_dispatch:

env:
  APP_VERSION: 0.2.0

defaults:
  run:
    working-directory: android-kotlin

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Unit tests (Kotlin engine)
        run: gradle test --no-daemon --console=plain

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Signing secrets are missing - the APK would not install."
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "using build-tools: $BUILD_TOOLS"
          KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          APK_DIR="app/build/outputs/apk/release"
          UNSIGNED="$APK_DIR/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/app-aligned.apk"
          SIGNED="$APK_DIR/Calculator-Kotlin-$APP_VERSION-android.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"

      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-kotlin-apk
          path: android-kotlin/app/build/outputs/apk/release/Calculator-Kotlin-*.apk
          if-no-files-found: error
